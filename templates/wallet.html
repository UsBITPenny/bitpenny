<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITPenny Exchange</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="dark">

  <!-- Header -->
  <div class="header">
    <div class="logo">💹 BITPenny</div>
    <div class="actions">
      <div class="price">1 BITP = $<span id="bitpPrice">0.01</span></div>
      <div class="profile" id="profile">
        <span id="userEmail">Guest</span> ▼
        <div class="dropdown" id="profileDropdown">
          <button onclick="loginPrompt()">Sign In</button>
          <button onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <ul>
      <li class="active">Dashboard</li>
      <li>Markets</li>
      <li>Trade</li>
      <li>Wallets</li>
      <li>History</li>
      <li>AI Assistant 🤖</li>
      <li>Settings</li>
      <li>Support</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Balance Panel -->
    <section>
      <h2>💰 Wallet Balance</h2>
      <p>USD: $<span id="usdBalance">0.00</span></p>
      <p>BITP: <span id="bitpBalance">0.0000</span></p>
      <p>Exchange Fee Revenue: $<span id="exchangeRevenue">0.00</span></p>
    </section>

    <!-- Trade Panel -->
    <section>
      <h2>📈 Trade BITP</h2>
      <input type="number" id="tradeAmount" placeholder="Amount in USD">
      <button onclick="buy()">Buy BITP</button>
      <button onclick="sell()">Sell BITP</button>
      <div id="tradeLog" class="green"></div>
    </section>

    <!-- Deposit Panel -->
    <section>
      <h2>🏦 Deposit USD</h2>
      <input type="number" id="depositAmount" placeholder="Enter amount to deposit">
      <button onclick="deposit()">Deposit</button>
      <div id="depositLog" class="green"></div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
