<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BITPenny Exchange</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='bitp-logo.png') }}">
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0ffe0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .logo {
            margin-top: 60px;
        }
        .logo img {
            width: 160px;
            filter: drop-shadow(0 0 10px #00ff99);
        }
        h1 {
            margin-top: 20px;
            font-size: 3em;
            color: #00ff99;
            text-shadow: 0 0 10px #00ff99;
        }
        .btn {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            background-color: #00ff99;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 12px #00ff99;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00cc77;
            box-shadow: 0 0 20px #00ff99;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="{{ url_for('static', filename='bitp-logo.png') }}" alt="BITPenny Logo">
    </div>
    <h1>Welcome to BITPenny</h1>

    {% if logged_in %}
        <p>Hello, {{ name }}!</p>
        <a href="/wallet" class="btn">Go to Wallet</a>
    {% else %}
        <a href="/login" class="btn">Sign in with Google</a>
    {% endif %}
</body>
</html>
